# Hexo Configuration
## Docs: https://hexo.io/docs/configuration.html
## Source: https://github.com/hexojs/hexo/

# Site
title: Sergi Mansilla
subtitle:
description: Sergi Mansilla's thoughts and articles on engineering, AI at the edge, and building software that lasts.
keywords: Sergi Mansilla, engineering, AI, edge computing, software, JavaScript, reactive programming
author: Sergi Mansilla
language: en
timezone: Europe/Madrid

# Social sharing (Open Graph / Twitter Cards)
social:
  bluesky: https://mu.social/profile/sergimansilla.com
  linkedin: https://www.linkedin.com/in/smansilla/
  github: https://github.com/sergi
  image: /images/social-card.jpg

# URL
## If your site is put in a subdirectory, set url as 'http://yoursite.com/child' and root as '/child/'
url: https://sergimansilla.com
root: /
permalink: blog/:title/
permalink_defaults:

# Directory
source_dir: source
public_dir: public
tag_dir: tags
archive_dir: archives
category_dir: categories
code_dir: downloads/code
i18n_dir: :lang
skip_render: CNAME

# Writing
new_post_name: :title.md # File name of new posts
default_layout: post
titlecase: false # Transform title into titlecase
external_link: true # Open external links in new tab
filename_case: 0
render_drafts: false
post_asset_folder: false
relative_link: false
future: true
highlight:
  enable: false
  line_number: true
  auto_detect: false
  tab_replace:

# Home page setting
# path: Root path for your blogs index page. (default = '')
# per_page: Posts displayed per page. (0 = disable pagination)
# order_by: Posts order. (Order by date descending by default)
index_generator:
  path: ''
  per_page: 0
  order_by: -date

# Category & Tag
default_category: uncategorized
category_map:
tag_map:

# Date / Time format
## Hexo uses Moment.js to parse and display date
## You can customize the date format as defined in
## http://momentjs.com/docs/#/displaying/format/
date_format: YYYY-MM-DD
time_format: HH:mm:ss

# Pagination
## Set per_page to 0 to disable pagination
per_page: 5
pagination_dir: page

# Archive pages
## per_page: 0 shows every post on the Articles page (no pagination)
archive_generator:
  per_page: 0
  yearly: true
  monthly: true
  daily: false
  order_by: -date

# Extensions
## Plugins: https://hexo.io/plugins/
## Themes: https://hexo.io/themes/
theme: landscape

# Deployment
## Docs: https://hexo.io/docs/deployment.html
deploy:
  type:

feed:
  type:
    - atom
    - rss2
  path:
    - atom.xml
    - rss.xml
  limit: 0
  hub:
  content:
  content_limit: 140
  content_limit_delim: ' '
  order_by: -date
  icon: /images/feed-icon-144x144.png
  # Custom templates: add feed metadata and avoid a bogus Disqus comments link.
  template:
    - feed-templates/atom.xml
    - feed-templates/rss.xml

